  <script>
    if (window.JIWAN) (function(){
    const { byId, coverHTML, iconHTML, scoreText, mountChrome, gameHref, toast, fableLabel, t, tagLabel, reviewLabel, applyI18n, gameTitle, loginHref, esc, avatarHTML, postHref, userHref, authorLabel} = JIWAN;
    const api = JIWAN.api;
    mountChrome('profile');
    const TABS = ['play', 'fav', 'review', 'posts', 'made'];
    let tab = (function () {
      const v = new URLSearchParams(location.search).get('tab');
      return TABS.indexOf(v) >= 0 ? v : 'play';
    })();
    let payload = null;
    function writeTab() {
      const p = new URLSearchParams(location.search);
      if (tab === 'play') p.delete('tab'); else p.set('tab', tab);
      const qs = p.toString();
      history.replaceState(null, '', qs ? ('profile.html?' + qs) : 'profile.html');
    }
    async function load(){
      const me = api && api.meSync && api.meSync();
      if (!me) { payload = null; paint(); return; }
      try { payload = await api.getUser(me.id); }
      catch (e) { payload = null; }
      paint();
    }
    function paint(){
      const me = api && api.meSync && api.meSync();
      document.querySelectorAll('#profile-tabs .page-tab').forEach(b => b.classList.toggle('is-on', b.dataset.tab === tab));
      const tools = document.getElementById('profile-tools');
      if (tools) tools.hidden = !me;
      const outBar = document.getElementById('btn-logout-bar');
      if (outBar) outBar.onclick = () => { api.logout(); toast(t('auth.loggedOut')); location.href = 'index.html'; };
      if (!me) {
        document.getElementById('profile-name').textContent = t('nav.login');
        document.getElementById('stat-play').textContent = '0';
        document.getElementById('stat-rev').textContent = '0';
        document.getElementById('stat-pub').textContent = '0';
        document.getElementById('profile-body').innerHTML = '<div class="empty">' + t('profile.loginGate') + ' <a class="more-link" href="' + loginHref('profile.html') + '">' + t('nav.login') + '</a></div>';
        applyI18n();
        return;
      }
      const playing = (payload && payload.playing) || [];
      const favs = (payload && payload.favs) || [];
      const people = (payload && payload.people) || [];
      const reviews = (payload && payload.reviews) || [];
      const posts = (payload && payload.posts) || [];
      const made = (payload && payload.made) || [];
      const packs = (payload && payload.packs) || [];
      document.getElementById('profile-name').innerHTML = avatarHTML(me, 'user-face') + ' ' + esc(me.name);
      document.getElementById('stat-play').textContent = playing.length;
      document.getElementById('stat-rev').textContent = reviews.length;
      document.getElementById('stat-pub').textContent = made.length + packs.filter(p => p.status !== 'listed').length;
      const body = document.getElementById('profile-body');
      function shelf(list, emptyKey, od, note) {
        if (!list.length) return '<div class="empty">' + t(emptyKey) + '</div>';
        return `<div class="shelf-list">${list.map(g =>
              `<a class="rank-item" href="${gameHref(g.id)}" data-od-id="${od}-${g.id}">
                ${iconHTML(g)}
                <span><span class="row-title">${gameTitle(g)}</span><div class="row-sub">${authorLabel(g)}</div></span>
                <span class="score">${scoreText(g)}</span>
              </a>`).join('')}</div>` + (note ? '<p class="note">' + t(note) + '</p>' : '');
      }
      if (tab === 'play') {
        body.innerHTML = shelf(playing, 'profile.emptyPlay', 'play', 'profile.playNote');
      } else if (tab === 'fav') {
        const peopleHTML = people.length
          ? `<div class="shelf-list">${people.map(u =>
              `<a class="rank-item" href="${userHref(u.id)}" data-od-id="people-${u.id}">
                <span>${avatarHTML(u, 'user-face')}</span>
                <span><span class="row-title">${esc(u.name)}</span><div class="row-sub">${esc(u.handle || u.id)}</div></span>
              </a>`).join('')}</div>`
          : '<div class="empty">' + t('profile.emptyPeople') + '</div>';
        body.innerHTML = '<div class="section-head"><h2>' + t('profile.favGames') + '</h2></div>' +
          shelf(favs, 'profile.emptyFav', 'fav', '') +
          '<div class="section-head"><h2>' + t('profile.people') + '</h2></div>' + peopleHTML;
      } else if (tab === 'posts') {
        body.innerHTML = posts.length
          ? `<div class="posts">${posts.map(p => {
              const g = byId(p.game);
              return `<article class="post" data-od-id="mine-post-${p.id}">
                <div>
                  <h3><a href="${postHref(p.id)}">${esc(p.title)}</a></h3>
                  <div class="meta">${p.time}${g ? ' · ' + gameTitle(g) : ''}</div>
                </div>
              </article>`;
            }).join('')}</div>`
          : '<div class="empty">' + t('profile.emptyPosts') + '</div>';
      } else if (tab === 'review') {
        body.innerHTML = reviews.length
          ? `<div class="reviews">${reviews.map(r => {
          const g = byId(r.game);
          return `<article class="review">
            <header><span>${g ? gameTitle(g) : r.game}</span><span class="score">${r.score != null ? r.score.toFixed(1) + ' · ' : ''}${reviewLabel(r.s)}</span></header>
            <p style="margin:0">${esc(r.t)}</p>
            ${g ? `<p><a class="more-link" href="${gameHref(g.id)}">${t('cta.seeGame')}</a></p>` : ''}
          </article>`;
        }).join('')}</div>`
          : '<div class="empty">' + t('detail.noReviews') + '</div>';
      } else {
        const packCards = packs.map(p => {
          const vis = p.status === 'listed' ? t('workshop.statusListed') : p.status === 'rejected' ? t('workshop.statusRejected') : p.status === 'pending' ? t('workshop.statusPending') : t('workshop.statusDraft');
          const href = p.status === 'listed' ? gameHref(p.id) : 'workshop.html#publish';
          return `<a class="browse-card" href="${href}" data-od-id="pack-${p.id}">
            <div class="thumb">${p.coverData ? `<div class="cover has-poster"><img class="poster" src="${p.coverData}" alt=""></div>` : `<div class="cover" style="--hue:70;--chroma:0.1"></div>`}</div>
            <p>${esc(p.title)}</p>
            <div class="meta">${vis}</div>
          </a>`;
        }).join('');
        const gameCards = made.map(g =>
              `<a class="browse-card" href="${gameHref(g.id)}" data-od-id="made-${g.id}">
                <div class="thumb">${coverHTML(g, fableLabel(g))}</div>
                <p>${gameTitle(g)}</p>
                <div class="meta"><span class="score">${scoreText(g)}</span> · ${tagLabel(g.tags[0])}</div>
              </a>`).join('');
        body.innerHTML = (made.length || packs.length)
          ? `<div class="browse-grid">${gameCards}${packCards}</div>
            <p class="note">${t('profile.madeNote')}</p>
            <p class="profile-tools"><button class="btn" type="button" id="btn-logout-profile" data-od-id="profile-logout">${t('profile.logout')}</button></p>`
          : '<div class="empty">' + t('profile.emptyMade') + '</div><p class="profile-tools"><button class="btn" type="button" id="btn-logout-profile" data-od-id="profile-logout">' + t('profile.logout') + '</button></p>';
        const out = document.getElementById('btn-logout-profile');
        if (out) out.onclick = () => { api.logout(); toast(t('auth.loggedOut')); location.href = 'index.html'; };
      }
      applyI18n();
    }
    document.getElementById('profile-tabs').addEventListener('click', e => {
      const b = e.target.closest('[data-tab]');
      if (!b) return;
      tab = b.dataset.tab;
      writeTab();
      paint();
    });
    window.addEventListener('jiwan:langchange', paint);
    writeTab();
    load();
      })();
  </script>
</body>
</html>
