  <script>
    if (window.JIWAN) (function(){
    const { RANK_TABS, RANK_PERIODS, RANK_TAB_NAME, RANK_PERIOD_NAME, rankIndexMap, rankMoveHTML, iconHTML, scoreText, playerLine, bindLivePlayers, mountChrome, gameHref, t, applyI18n, gameTitle, failHTML, loadingHTML, authorLabel} = JIWAN;
    const api = JIWAN.api;
    const params = new URLSearchParams(location.search);
    const state = {
      tab: params.get('tab') || 'hot',
      period: params.get('period') || 'day',
      prev: params.get('prev') || ''
    };
    if (!['hot','new','score'].includes(state.tab)) state.tab = 'hot';
    if (!['day','week','month'].includes(state.period)) state.period = 'day';
    mountChrome('rank');
    async function paint(){
      document.title = t('title.rank');
      document.getElementById('rank-tabs').innerHTML = RANK_TABS.map(([id, lab]) =>
        `<button class="rank-tab${state.tab===id?' is-on':''}" type="button" data-tab="${id}" data-od-id="rank-tab-${id}">${lab}</button>`
      ).join('');
      document.getElementById('rank-period').innerHTML = RANK_PERIODS.map(([id, lab]) =>
        `<button class="period-btn${state.period===id?' is-on':''}" type="button" data-period="${id}" data-od-id="rank-period-${id}" role="tab" aria-selected="${state.period===id}" aria-label="${RANK_TAB_NAME[state.tab]} · ${RANK_PERIOD_NAME[id]}">${lab}</button>`
      ).join('');
      const prevPeriod = (state.prev && state.prev !== state.period) ? state.prev : (state.period === 'day' ? 'week' : 'day');
      const prevName = RANK_PERIOD_NAME[prevPeriod];
      document.getElementById('rank-list').innerHTML = loadingHTML();
      let data;
      try {
        data = await api.getRankings({ tab: state.tab, period: state.period, n: 20, prev: prevPeriod });
      } catch (e) {
        document.getElementById('rank-kicker').textContent = RANK_TAB_NAME[state.tab] + ' · ' + RANK_PERIOD_NAME[state.period];
        document.getElementById('rank-list').innerHTML = failHTML('rank-retry');
        const retry = document.getElementById('rank-retry');
        if (retry) retry.onclick = paint;
        applyI18n();
        return;
      }
      const list = data.items || [];
      document.getElementById('rank-kicker').textContent = RANK_TAB_NAME[state.tab] + ' · ' + RANK_PERIOD_NAME[state.period];
      document.getElementById('rank-list').innerHTML = list.map((g, i) => {
        const cur = i + 1;
        return `<a class="rank-item" href="${gameHref(g.id)}" data-od-id="rank-row-${g.id}">
          <span class="rank-n"><b>${String(cur).padStart(2,'0')}</b>${rankMoveHTML(cur, rankIndexMap()[g.id], prevName)}</span>
          ${iconHTML(g)}
          <span>
            <span class="row-title">${gameTitle(g)}</span>
            <div class="row-sub">${authorLabel(g)} · <span class="live-count" data-live-players="${g.id}">${playerLine(g)}</span></div>
          </span>
          <span class="score">${scoreText(g)}</span>
        </a>`;
      }).join('');
      const more = document.getElementById('rank-more');
      more.href = `browse.html?sort=${state.tab}&from=rank&period=${state.period}&prev=${prevPeriod}`;
      more.setAttribute('aria-label', t('rank.moreAria', {name: RANK_TAB_NAME[state.tab], period: RANK_PERIOD_NAME[state.period]}));
      const p = new URLSearchParams();
      if (state.tab !== 'hot') p.set('tab', state.tab);
      if (state.period !== 'day') p.set('period', state.period);
      history.replaceState(null, '', p.toString() ? ('rankings.html?' + p) : 'rankings.html');
      applyI18n();
      if (bindLivePlayers) bindLivePlayers();
    }
    document.addEventListener('click', e => {
      const tab = e.target.closest('[data-tab]');
      if (tab) { state.tab = tab.dataset.tab; paint(); return; }
      const p = e.target.closest('[data-period]');
      if (p) {
        if (p.dataset.period !== state.period) { state.prev = state.period; state.period = p.dataset.period; }
        paint();
      }
    });
    window.addEventListener('jiwan:langchange', paint);
    paint();
      })();
  </script>
