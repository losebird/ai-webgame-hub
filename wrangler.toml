# 即玩：同源 Worker（静态资源 + API）+ D1
# database_id 已换成线上 D1。本地 wrangler dev --local 不依赖此 id。
# routes 仍先注释：jiwan.space 的 zone 还在等待阿里云改域名服务器；未生效时启用 routes 可能让 deploy 失败。
# workers_dev = true 暂留作退路。当前预览：https://jiwan.playjiwan.workers.dev
name = "jiwan"
main = "worker/index.js"
compatibility_date = "2026-11-14"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
# 不要把 /admin.html 重写成 /admin，否则会撞上 API 的 /admin 并返回 401 JSON。
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "jiwan"
database_id = "bf842924-7a17-48a1-954e-84281f2dee90"
migrations_dir = "migrations"

# 域名生效后再取消注释并重新部署：
# [[routes]]
# pattern = "jiwan.space/*"
# zone_name = "jiwan.space"
# [[routes]]
# pattern = "*.jiwan.space/*"
# zone_name = "jiwan.space"
