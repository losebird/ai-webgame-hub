# 即玩：同源 Worker（静态资源 + API）+ D1
# database_id 是占位符。本地 wrangler dev --local 不需要真实账号或 id。
# 将来正式部署前，用 `wrangler d1 create jiwan` 换上真实 id。
name = "jiwan"
main = "worker/index.js"
compatibility_date = "2026-11-14"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
# 不要把 /admin.html 重写成 /admin，否则会撞上 API 的 /admin 并返回 401 JSON。
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "jiwan"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# 正式域名尚未购买、Cloudflare zone 也未绑定。
# 不要启用下面的 routes：未绑定 zone 时 `wrangler deploy` 会失败。
# 本轮不要执行 wrangler login / deploy。workers_dev = true 先保留作退路。
# 购买并接入 Cloudflare 后，把 database_id 换成真实值，取消注释这两段路由，再部署：
# [[routes]]
# pattern = "jiwan.space/*"
# zone_name = "jiwan.space"
# [[routes]]
# pattern = "*.jiwan.space/*"
# zone_name = "jiwan.space"

