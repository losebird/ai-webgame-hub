# 即玩：同源 Worker（静态资源 + API）+ D1
# database_id 已换成线上 D1。本地 wrangler dev --local 不依赖此 id。
# routes 已启用：jiwan.space 已托管到 Cloudflare（阿里云 NS 已改为 cruz/mitch.ns.cloudflare.com），@ 与 * 为代理的 AAAA 100:: 占位记录。
# workers_dev = true 保留作备用入口。当前预览：https://jiwan.playjiwan.workers.dev
name = "jiwan"
main = "worker/index.js"
compatibility_date = "2026-11-14"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
# 不要把 /admin.html 重写成 /admin，否则会撞上 API 的 /admin 并返回 401 JSON。
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "jiwan-apac"
database_id = "9e312478-2850-4afe-b144-b93dcce49264"
migrations_dir = "migrations"
# 旧库 jiwan / bf842924-7a17-48a1-954e-84281f2dee90 仍保留在 ENAM，未删除。
# 2026-11-14 从该库完整导出后导入本亚太库，回读 games/users/reviews/packs 等行数一致后再切换绑定。

# 自定义域名路由（apex 与通配子域）：
[[routes]]
pattern = "jiwan.space/*"
zone_name = "jiwan.space"
[[routes]]
pattern = "*.jiwan.space/*"
zone_name = "jiwan.space"
