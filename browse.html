  <script>
    if (window.JIWAN) (function(){
    const { GENRES, DURATIONS, FABLE, RANK_TABS, RANK_PERIODS, RANK_TAB_NAME, RANK_PERIOD_NAME,
      rankIndexMap, rankMoveHTML, coverHTML, scoreText,
      mountChrome, gameHref, t, tagLabel, sortLabel, applyI18n, gameTitle, pagerHTML, failHTML, loadingHTML } = JIWAN;
    const api = JIWAN.api;
    const PAGE_SIZE = 12;
    const params = new URLSearchParams(location.search);
    const state = {
      genre: params.get('genre') || 'all',
      duration: params.get('duration') || 'all',
      fable: params.get('fable') || 'all',
      sort: params.get('sort') || 'hot',
      period: params.get('period') || 'day',
      prev: params.get('prev') || '',
      fromRank: params.get('from') === 'rank',
      q: params.get('q') || '',
      tag: params.get('tag') || '',
      source: params.get('source') === 'workshop' ? 'workshop' : '',
      page: Math.max(1, Number(params.get('page')) || 1)
    };
    if (state.source === 'workshop') state.fable = 'all';
    if (!['hot','new','score'].includes(state.sort)) state.sort = 'hot';
    if (!['day','week','month'].includes(state.period)) state.period = 'day';
    mountChrome('browse');
    function writeUrl(){
      const p = new URLSearchParams();
      if (state.genre !== 'all') p.set('genre', state.genre);
      if (state.duration !== 'all') p.set('duration', state.duration);
      if (state.fable !== 'all') p.set('fable', state.fable);
      if (state.sort !== 'hot') p.set('sort', state.sort);
      if (state.fromRank) {
        p.set('from', 'rank');
        p.set('sort', state.sort);
        p.set('period', state.period);
        if (state.prev) p.set('prev', state.prev);
      }
      if (state.source) p.set('source', state.source);
      if (state.q) p.set('q', state.q);
      if (state.tag) p.set('tag', state.tag);
      if (state.page > 1) p.set('page', String(state.page));
      const qs = p.toString();
      history.replaceState(null, '', qs ? ('browse.html?' + qs) : 'browse.html');
    }
    function opts(list, key, host){
      if (!host) return;
      host.innerHTML = list.map(it =>
        `<button class="filter-opt${state[key]===it.id?' is-on':''}" type="button" data-filter="${key}" data-id="${it.id}" data-od-id="filter-${key}-${it.id}">${it.label}</button>`
      ).join('');
    }
    function paintFilters(){
      opts(GENRES, 'genre', document.getElementById('genre-filters'));
      opts(DURATIONS, 'duration', document.getElementById('duration-filters'));
      opts(FABLE, 'fable', document.getElementById('fable-filters'));
      opts(GENRES, 'genre', document.getElementById('genre-chips'));
      opts(DURATIONS, 'duration', document.getElementById('duration-chips'));
      opts(FABLE, 'fable', document.getElementById('fable-chips'));
      /* 看「工坊上架」时，来源筛选（Fable / 不含工坊）自相矛盾，直接收起来 */
      const fromWorkshop = state.source === 'workshop';
      ['fable-filters', 'fable-chips'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.hidden = fromWorkshop;
        const field = el.closest('.field, .filter-group, .mobile-block, .chip-group');
        if (field) field.hidden = fromWorkshop;
      });
    }
    function titleFor(){
      if (state.source === 'workshop') return t('browse.workshopTitle');
      if (state.fromRank) return RANK_TAB_NAME[state.sort] || t('rank.title');
      if (state.tag) return tagLabel(state.tag);
      if (state.fable === 'workshop' && state.genre === 'all') return t('nav.workshop');
      const g = GENRES.find(x => x.id === state.genre);
      if (g && g.id !== 'all') return g.label;
      return t('browse.title');
    }
    async function paint(){
      paintFilters();
      const ledeKey = state.source === 'workshop' ? 'browse.workshopLede' : 'browse.lede';
      const lede = document.getElementById('browse-lede');
      lede.setAttribute('data-i18n', ledeKey);
      lede.textContent = t(ledeKey);
      const periodBox = document.getElementById('rank-period');
      periodBox.hidden = !state.fromRank;
      if (state.fromRank) {
        periodBox.innerHTML = RANK_PERIODS.map(([id, lab]) =>
          `<button class="period-btn${state.period===id?' is-on':''}" type="button" data-period="${id}" data-od-id="period-${id}" role="tab" aria-selected="${state.period===id}">${lab}</button>`
        ).join('');
      }
      document.getElementById('sort-tabs').innerHTML = RANK_TABS.map(([id]) =>
        `<button class="rank-tab${state.sort===id?' is-on':''}" type="button" data-sort="${id}" data-od-id="sort-${id}">${sortLabel(id)}</button>`
      ).join('');
      const grid = document.getElementById('browse-grid');
      const pagerBox = document.getElementById('browse-pager');
      grid.innerHTML = loadingHTML();
      pagerBox.innerHTML = '';
      let list = [];
      let total = 0;
      let prevName = '';
      try {
        const prevPeriod = (state.prev && state.prev !== state.period) ? state.prev : (state.period === 'day' ? 'week' : 'day');
        const data = await api.getGames({
          genre: state.genre, duration: state.duration, fable: state.fable, q: state.q, tag: state.tag, source: state.source,
          sort: state.sort, page: state.page, pageSize: PAGE_SIZE,
          from: state.fromRank ? 'rank' : '', period: state.fromRank ? state.period : '',
          prev: state.fromRank ? prevPeriod : ''
        });
        list = data.items || [];
        total = data.total || list.length;
        if (state.fromRank) prevName = RANK_PERIOD_NAME[(data.prev && data.prev.period) || prevPeriod];
        const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (state.page > pages) { state.page = pages; writeUrl(); }
      } catch (e) {
        document.title = t('title.browse');
        document.getElementById('browse-title').textContent = titleFor();
        document.getElementById('result-count').textContent = '';
        grid.innerHTML = failHTML('browse-retry');
        const retry = document.getElementById('browse-retry');
        if (retry) retry.onclick = paint;
        applyI18n();
        writeUrl();
        return;
      }
      document.title = t('title.browse');
      document.getElementById('browse-title').textContent = titleFor();
      document.getElementById('browse-kicker').textContent = state.fromRank
        ? (RANK_TAB_NAME[state.sort] + ' · ' + RANK_PERIOD_NAME[state.period])
        : t('browse.kicker');
      document.getElementById('result-count').textContent = t('browse.count', {n: total});
      if (!list.length) {
        grid.innerHTML = '<div class="empty">' + t('browse.empty') + '</div>';
      } else {
        const offset = (state.page - 1) * PAGE_SIZE;
        grid.innerHTML = list.map((g, i) => {
          const rank = state.fromRank
            ? `<span class="browse-rank"><b>${String(offset + i + 1).padStart(2,'0')}</b>${rankMoveHTML(offset + i + 1, rankIndexMap()[g.id], prevName)}</span>`
            : '';
          return `<a class="browse-card" href="${gameHref(g.id)}" data-od-id="browse-card-${g.id}">
            <div class="thumb">${rank}${coverHTML(g, undefined, {eager: i < 3})}</div>
            <p>${gameTitle(g)}</p>
            <div class="meta"><span class="score">${scoreText(g)}</span> · ${tagLabel(g.tags[0])}</div>
          </a>`;
        }).join('');
      }
      pagerBox.innerHTML = pagerHTML(state.page, PAGE_SIZE, total, 'browse-pager-nav');
      const bits = [];
      if (state.source !== 'workshop' && (state.fable === 'workshop' || list.some(g => g.fable))) bits.push(t('browse.noteFable'));
      if (state.fromRank) bits.push(t('browse.noteRank'));
      document.getElementById('browse-note').textContent = bits.join(' ');
      applyI18n();
      writeUrl();
    }
    document.addEventListener('click', e => {
      const pg = e.target.closest('[data-page]');
      if (pg && !pg.disabled && pg.closest('#browse-pager')) {
        const n = Number(pg.dataset.page);
        if (n >= 1) { state.page = n; paint(); }
        return;
      }
      const f = e.target.closest('[data-filter]');
      if (f) { state[f.dataset.filter] = f.dataset.id; state.page = 1; paint(); return; }
      const s = e.target.closest('[data-sort]');
      if (s) { state.sort = s.dataset.sort; state.page = 1; paint(); return; }
      const p = e.target.closest('[data-period]');
      if (p) {
        if (p.dataset.period !== state.period) { state.prev = state.period; state.period = p.dataset.period; }
        state.page = 1;
        paint();
      }
    });
    document.getElementById('reset-filters').onclick = () => {
      state.genre = 'all'; state.duration = 'all'; state.fable = 'all'; state.q = ''; state.tag = ''; state.page = 1;
      paint();
    };
    window.addEventListener('jiwan:langchange', paint);
    paint();
      })();
  </script>
</body>
</html>
